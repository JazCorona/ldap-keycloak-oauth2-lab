services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: "Example Corp"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      # TLS habilitado (la imagen genera certificados y escucha LDAPS en 636).
      LDAP_TLS: "true"
    ports:
      # Solo se publica al host el puerto TLS (LDAPS 636). El 389 (texto plano)
      # queda SIN publicar: sigue disponible dentro de la red Docker para que
      # Keycloak federe (ldap://openldap:389), pero no se expone fuera.
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks: [auth-network]

  # --- Protección EXTRA a nivel de puerto para LDAPS (636) ---
  # Comparte el network namespace de openldap y aplica reglas iptables que
  # limitan tasa y concurrencia de conexiones nuevas al puerto TLS 636.
  ldap-fw:
    image: alpine:3.20
    container_name: openldap-fw
    network_mode: "service:openldap"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./ldap/ldap-fw.sh:/ldap-fw.sh:ro
    entrypoint: ["/bin/sh", "/ldap-fw.sh"]
    depends_on: [openldap]

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on: [openldap]
    networks: [auth-network]

  postgres:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpassword
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    networks: [auth-network]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: adminpassword
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on: [postgres, openldap]
    networks: [auth-network]

  api:
    build: ./fastapi
    container_name: ldap-oauth-api
    # Fail2Ban dentro del contenedor banea con iptables: requiere estas caps.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8000:8000"   # Nginx + Fail2Ban al frente (uvicorn queda en 127.0.0.1:9000)
    environment:
      KEYCLOAK_INTERNAL: http://keycloak:8080
      KEYCLOAK_PUBLIC: http://localhost:8081
      KEYCLOAK_REALM: cybersecurity
      KEYCLOAK_CLIENT_ID: fastapi-api
    depends_on: [keycloak]
    networks: [auth-network]

volumes:
  ldap_data:
  ldap_config:
  keycloak_db:

networks:
  auth-network:
