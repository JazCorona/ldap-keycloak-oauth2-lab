# Nginx al frente de la API FastAPI del lab (la del flujo OAuth2/JWT con
# Keycloak+LDAP). Único punto expuesto en el puerto público (8000). Reenvía al
# uvicorn en loopback (127.0.0.1:9000) y escribe el access.log que Fail2Ban vigila.
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log /var/log/nginx/access.log combined;
  sendfile on;

  upstream app_api { server 127.0.0.1:9000; }

  server {
    listen 8000;
    server_name _;

    location / {
      proxy_pass http://app_api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
